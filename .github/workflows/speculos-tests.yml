# Integration tests on Speculos (Stax), built inside Ledger's dev-tools image.
# The app is one of:
# - v8: vacuumlabs/ledger-app-cardano-dev, review screens confirmed by
#   scripts/speculos-autonav.mjs
# - v7: LedgerHQ/app-cardano-legacy, built with HEADLESS, which confirms the
#   review screens itself
# The callers choose the app, the ref and the image:
# - ci.yml: pinned Stax releases, for pull requests
# - app-develop-drift.yml: the latest v8 develop
# - speculos-manual.yml: any ref, started by hand
# The log prints the app commit, the Stax SDK version and the Speculos version.
name: Speculos tests

on:
  workflow_call:
    inputs:
      image:
        description: dev-tools image to build the app and run Speculos in
        required: true
        type: string
      app:
        description: 'the app to build: v8 (ledger-app-cardano-dev) or v7 (app-cardano-legacy)'
        required: false
        type: string
        default: v8
      app_ref:
        description: branch, tag or commit SHA of the app repo to build
        required: true
        type: string
      app_commit:
        description: full commit SHA that app_ref must point at; empty skips the check
        required: false
        type: string
        default: ''
      stax_sdk_version:
        description: Stax SDK version the image must contain; empty skips the check
        required: false
        type: string
        default: ''
    secrets:
      APP_DEPLOY_KEY:
        description: private part of a read-only deploy key of vacuumlabs/ledger-app-cardano-dev; only for v8
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  speculos_tests:
    # A fixed name, because branch protection requires this check by name. The
    # app ref is in the name of the clone step.
    name: Speculos tests
    env:
      # the app clone; test-speculos.sh reads it to find the app build
      APP_REPO: ../${{ inputs.app == 'v7' && 'app-cardano-legacy' || 'ledger-app-cardano-dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y openssh-client lsof libusb-1.0-0-dev libudev-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable

      - name: Clone the app (${{ inputs.app }} ${{ inputs.app_ref }})
        env:
          APP: ${{ inputs.app }}
          APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
          APP_REF: ${{ inputs.app_ref }}
          APP_COMMIT: ${{ inputs.app_commit }}
          STAX_SDK_VERSION: ${{ inputs.stax_sdk_version }}
        run: |
          case "$APP" in
            v8)
              # a private repo, read with the deploy key
              key_file="$RUNNER_TEMP/app_deploy_key"
              trap 'rm -f "$key_file"' EXIT
              printf '%s\n' "$APP_DEPLOY_KEY" >"$key_file"
              chmod 600 "$key_file"
              export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
              app_url=git@github.com:vacuumlabs/ledger-app-cardano-dev.git
              ;;
            v7)
              app_url=https://github.com/LedgerHQ/app-cardano-legacy.git
              ;;
            *)
              echo "::error::unknown app '$APP', expected v8 or v7"
              exit 1
              ;;
          esac
          # fetch, not clone --branch: the ref can also be a commit SHA
          git init -q "$APP_REPO"
          git -C "$APP_REPO" remote add origin "$app_url"
          git -C "$APP_REPO" fetch -q --depth 1 origin "$APP_REF"
          git -C "$APP_REPO" checkout -q FETCH_HEAD
          git -C "$APP_REPO" log -1 --format="app: $APP $APP_REF %H %ci %s"
          # tags in the app repo can be moved
          actual_commit="$(git -C "$APP_REPO" rev-parse HEAD)"
          if [ -n "$APP_COMMIT" ] && [ "$actual_commit" != "$APP_COMMIT" ]; then
            echo "::error::$APP_REF points at $actual_commit, expected $APP_COMMIT"
            exit 1
          fi
          sdk_version="$(git -C "$STAX_SDK" describe --tags 2>/dev/null || echo unknown)"
          echo "Stax SDK: $sdk_version"
          if [ -n "$STAX_SDK_VERSION" ] && [ "$sdk_version" != "$STAX_SDK_VERSION" ]; then
            echo "::error::the image has Stax SDK $sdk_version, expected $STAX_SDK_VERSION"
            exit 1
          fi
          python3 -c 'import importlib.metadata as m; print("speculos", m.version("speculos"))'

      - name: Build the app (Stax, debug)
        if: inputs.app == 'v8'
        run: make -C "$APP_REPO" BOLOS_SDK="$STAX_SDK" DEBUG=1 -j4
      - name: Build the app (Stax, devel, headless)
        if: inputs.app == 'v7'
        # The variables are set in the environment, as in the CI of
        # app-cardano-legacy. As a make argument, DEFINES=HEADLESS would replace
        # all the DEFINES that the Makefile adds.
        run: BOLOS_SDK="$STAX_SDK" DEVEL=1 DEFINES=HEADLESS make -C "$APP_REPO" -j4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: speculos-node-modules-${{ hashFiles('yarn.lock', '.nvmrc') }}
      - name: Install dependencies
        run: yarn install

      - name: Integration tests on Speculos
        if: inputs.app == 'v8'
        run: yarn test-speculos --auto -n 4
        env:
          # print every screen and action, to show where a timed-out test stopped
          AUTONAV_LOG: 1
      - name: Integration tests on Speculos (headless)
        if: inputs.app == 'v7'
        # No --auto: the HEADLESS build confirms the screens itself. A test that
        # takes longer than 2 minutes is stuck.
        run: yarn test-speculos -n 4 --timeout 120000
