yarnPath: .yarn/releases/yarn-4.13.0.cjs

nodeLinker: node-modules

# prebuild-install is deprecated but only reached through node-hid@2.1.2,
# which the Ledger HID transports (dev only) pin exactly
# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no fixed release yet; only reached
# through gh-pages (dev only, docs deploy in CI). Remove once braces ships a fix.
# glob <=14.0.1 (GHSA-3g3m-2fjr-6pw4) and minimatch <11.0.1 (GHSA-g3hv-75wg-m249)
# have fixes only in new majors, and all paths to them are dev only:
# - glob ^13: mocha; node-gyp -> make-fetch-happen -> cacache (node-gyp is
#   pulled in by blake2, node-hid, usb, nan and node-addon-api)
# - minimatch ^10: mocha; eslint and @eslint/config-array;
#   @typescript-eslint/typescript-estree; typedoc; glob ^13 itself
# Remove each entry only after every path above uses a fixed major and
# `yarn audit` passes without it.
npmAuditIgnoreAdvisories:
  - 'prebuild-install (deprecation)'
  - '1240992' # braces, GHSA-vfj7-8cjw-p6xm
  - '1244013' # glob, GHSA-3g3m-2fjr-6pw4
  - '1244623' # minimatch, GHSA-g3hv-75wg-m249
